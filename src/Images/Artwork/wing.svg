<svg viewBox="0 0 400 100" width="100%" height="100%" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="left-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1a10" /><stop offset="40%" stop-color="#030804" /><stop offset="100%" stop-color="#0a1c12" />
    </linearGradient>
    <linearGradient id="left-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" /><stop offset="35%" stop-color="#ffffff" stop-opacity="0.0" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="left-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" /><stop offset="20%" stop-color="#22ff66" stop-opacity="0.9" /><stop offset="100%" stop-color="#22ff66" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base & Glass -->
  <path d="M 25 30 L 400 30 L 400 100 L 25 100 L 5 85 L 5 45 Z" fill="url(#left-bg)" />
  <path d="M 26 32 L 400 32 L 400 98 L 26 98 L 7 83 L 7 47 Z" fill="url(#left-glass)" stroke="#1a4d29" stroke-width="1.5" />

  <!-- Green Glows & Core Outline -->
  <path d="M 400 30 L 25 30 L 5 45 L 5 85 L 25 100 L 400 100" fill="none" stroke="#00ff33" stroke-width="8" opacity="0.3" stroke-linejoin="round" />
  <path d="M 400 30 L 25 30 L 5 45 L 5 85 L 25 100 L 400 100" fill="none" stroke="#22ff66" stroke-width="2" stroke-linejoin="round" />

  <!-- 3D Jewel Facets & Highlights -->
  <path d="M 5 45 L 35 55 L 35 75 L 5 85" fill="none" stroke="#22ff66" stroke-width="1.5" opacity="0.6" stroke-linejoin="round"/>
  <path d="M 50 30 L 350 30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Edge Flare -->
  <ellipse cx="200" cy="30" rx="100" ry="2.5" fill="url(#left-flare)" opacity="0.9" />
</svg>
