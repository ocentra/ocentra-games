<svg viewBox="0 0 500 260" width="100%" height="100%" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dome-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141108" /><stop offset="60%" stop-color="#080703" /><stop offset="100%" stop-color="#141108" />
    </linearGradient>
    <linearGradient id="dome-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" /><stop offset="35%" stop-color="#ffffff" stop-opacity="0.0" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <radialGradient id="dome-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" /><stop offset="25%" stop-color="#ffcc44" stop-opacity="0.9" /><stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base & Glass Semicircle -->
  <path d="M 20 260 A 230 230 0 0 1 480 260 Z" fill="url(#dome-bg)" />
  <path d="M 22 258 A 228 228 0 0 1 478 258 Z" fill="url(#dome-glass)" />

  <!-- Orange/Yellow Glow Arcs -->
  <path d="M 20 260 A 230 230 0 0 1 480 260" fill="none" stroke="#ff6600" stroke-width="16" opacity="0.25" />
  <path d="M 20 260 A 230 230 0 0 1 480 260" fill="none" stroke="#ff8800" stroke-width="6" opacity="0.5" />
  <path d="M 20 260 A 230 230 0 0 1 480 260" fill="none" stroke="#ffcc44" stroke-width="2.5" />

  <!-- Top Specular Highlight & Flare -->
  <path d="M 130 60 A 230 230 0 0 1 370 60" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="250" cy="30" rx="90" ry="3.5" fill="url(#dome-flare)" opacity="0.95" />
</svg>
