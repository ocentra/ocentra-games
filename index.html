<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ocentra Games - A modern, blockchain-powered multiplayer card game platform" />
    <title>Ocentra Games</title>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, rgb(0, 110, 104) 0%, rgb(0, 50, 100) 70%, rgb(0, 5, 15) 100%);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 1;
        transition: opacity 1.5s ease-out;
        color-scheme: light;
        contain: paint;
      }
      #app-loading.hide { opacity: 0; }
      #app-loading.hidden { visibility: hidden; }
      #app-loading .loader-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading .loader-spinner {
        position: absolute;
        width: clamp(148px, 37vw, 296px);
        height: clamp(148px, 37vw, 296px);
        animation: loader-spin 10s linear infinite;
        z-index: 1;
      }
      #app-loading .loader-comet-layer {
        position: absolute;
        inset: 0;
        background: transparent;
        animation: loader-pulse 2s ease-in-out infinite alternate;
      }
      #app-loading .loader-comet {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }
      #app-loading .loader-comet-head {
        position: absolute;
        left: calc(50% + 4px);
        top: 6%;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px #fff, 0 0 22px rgba(255,255,255,0.95), 0 0 40px rgba(255,255,255,0.6);
        transform: translate(-50%, -50%);
        animation: comet-flicker 0.95s steps(10, end) infinite;
        pointer-events: none;
      }
      #app-loading .loader-logo {
        position: relative;
        z-index: 0;
        width: clamp(140px, 35vw, 280px);
        height: clamp(140px, 35vw, 280px);
        opacity: 0.95;
        animation: loader-pulse 2s ease-in-out infinite alternate;
      }
      .ocentra-seo-fallback {
        position: fixed;
        inset-inline-start: -100vw;
        inset-block-start: 0;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        opacity: 0;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes loader-pulse {
        0% { transform: scale(1); opacity: 0.9; }
        100% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes comet-flicker {
        0% { opacity: 0.82; transform: translate(-50%, -50%) scale(0.92); }
        8% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
        16% { opacity: 0.88; transform: translate(-50%, -50%) scale(0.96); }
        24% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        36% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.98); }
        52% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        68% { opacity: 0.84; transform: translate(-50%, -50%) scale(0.94); }
        82% { opacity: 0.98; transform: translate(-50%, -50%) scale(1.04); }
        100% { opacity: 0.82; transform: translate(-50%, -50%) scale(0.92); }
      }
    </style>
    <script>
      (function () {
        const startedAt = performance.now();
        const bootTrace = [];
        const host = window.location.hostname;
        const shouldLogBoot = host === 'localhost' || host === '127.0.0.1' || host === '::1' || window.location.search.includes('profile=1') || window.location.search.includes('bootlog=1');
        const push = function (label) {
          const entry = { label: label, atMs: Number((performance.now() - startedAt).toFixed(2)), readyState: document.readyState };
          bootTrace.push(entry);
          if (shouldLogBoot) console.info('[boot:index +' + entry.atMs + 'ms] ' + label, entry);
        };
        window.__OCENTRA_BOOT_TRACE = bootTrace;
        window.__OCENTRA_BOOT_PUSH = push;
        window.__OCENTRA_BOOT_STARTED_AT = startedAt;
        push('index inline script executed');
        document.addEventListener('readystatechange', function () { push('readystatechange:' + document.readyState); });
        window.addEventListener('load', function () { push('window load'); });
      })();
    </script>
    <script type="module">
      import { Buffer } from 'buffer';
      window.Buffer = Buffer;
      window.global = window;
      window.process = { env: {} };
    </script>
  </head>
  <body>
    <div id="app-loading" aria-hidden="true">
      <div class="loader-wrap">
        <div class="loader-spinner" aria-hidden="true">
          <div class="loader-comet-layer">
            <img class="loader-comet" src="/OcentraLogoCommet.png" alt="" width="256" height="256" />
            <span class="loader-comet-head" aria-hidden="true"></span>
          </div>
        </div>
        <img class="loader-logo" src="/OcentraLogo.svg" alt="" width="128" height="128" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
