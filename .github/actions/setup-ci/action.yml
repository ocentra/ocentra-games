name: 'Setup CI Environment'
description: >
  The ONE place that configures a CI machine. Every workflow calls this.
  Use flags to opt-in to what you need: Node, Python, k6, cloudflared, etc.

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  install-mode:
    description: >
      How to install npm packages:
        "full"    → npm ci + optional deps
        "ci-only" → npm ci --ignore-scripts
        "skip"    → only Node binary, no npm install
    required: false
    default: 'full'
  build-domains:
    description: 'Build domain packages after install (npm run build:domains)'
    required: false
    default: 'false'
  install-python:
    description: 'Install Python + pip'
    required: false
    default: 'false'
  python-version:
    description: 'Python version (only used if install-python is true)'
    required: false
    default: '3.11'
  install-k6:
    description: 'Install k6 load testing tool'
    required: false
    default: 'false'
  install-cloudflared:
    description: 'Install cloudflared CLI'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # ── Node.js ────────────────────────────────────────────────────────────
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Pin npm version
      shell: bash
      run: npm install -g npm@11.7.0

    - name: Install dependencies (full)
      if: inputs.install-mode == 'full'
      shell: bash
      run: |
        npm ci
        npm install --no-save --include=optional || true

    - name: Install dependencies (ci-only)
      if: inputs.install-mode == 'ci-only'
      shell: bash
      run: npm ci --ignore-scripts

    - name: Build domain packages
      if: inputs.build-domains == 'true'
      shell: bash
      run: npm run build:domains

    # ── Python ─────────────────────────────────────────────────────────────
    - name: Setup Python
      if: inputs.install-python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    # ── k6 ─────────────────────────────────────────────────────────────────
    - name: Install k6
      if: inputs.install-k6 == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ca-certificates gnupg2
        sudo mkdir -p /usr/share/keyrings
        curl -fsSL https://dl.k6.io/key.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install -y k6

    # ── cloudflared ────────────────────────────────────────────────────────
    - name: Install cloudflared
      if: inputs.install-cloudflared == 'true'
      shell: bash
      run: |
        curl -sL -o /tmp/cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
        sudo dpkg -i /tmp/cloudflared.deb
        cloudflared --version
