name: Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      branch:
        description: 'Pages branch to deploy to (e.g. main, production)'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLAIM_STORAGE_WORKER_URL_DEV:
        required: true
      CLAIM_STORAGE_WORKER_URL_PROD:
        required: true
      VITE_R2_WORKER_URL:
        required: false
      VITE_R2_BUCKET_NAME:
        required: false
      VITE_LOGS_WORKER_URL:
        required: false
      VITE_LOGS_API_KEY:
        required: false
      LOGS_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Pages branch to deploy to'
        required: true
        type: choice
        options:
          - main
          - production
        default: main

permissions:
  contents: read
  deployments: write

jobs:
  deploy-pages:
    name: Deploy Pages (${{ inputs.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      - name: Build project
        shell: bash
        run: |
          # Safely trim any sneaky newlines or spaces from secrets
          CLEAN_DEV_URL=$(echo "${{ secrets.CLAIM_STORAGE_WORKER_URL_DEV }}" | xargs)
          CLEAN_PROD_URL=$(echo "${{ secrets.CLAIM_STORAGE_WORKER_URL_PROD }}" | xargs)
          
          CLEAN_LOGS_URL=$(echo "${{ secrets.VITE_LOGS_WORKER_URL }}" | xargs)
          
          # Try LOGS_API_KEY first, then fallback to VITE_LOGS_API_KEY
          CLEAN_LOGS_KEY=$(echo "${{ secrets.LOGS_API_KEY || secrets.VITE_LOGS_API_KEY }}" | xargs)
           
          if [ "${{ inputs.branch }}" == "production" ]; then
            export VITE_CLAIM_STORAGE_URL="$CLEAN_PROD_URL"
            export VITE_R2_WORKER_URL="$CLEAN_PROD_URL"
            export VITE_MAIN_REAL_CLAIM_STORAGE_URL="$CLEAN_PROD_URL"
            export VITE_MAIN_REAL_ASSETS_PUBLIC_URL="$CLEAN_PROD_URL/api/v1/assets"
          else
            export VITE_CLAIM_STORAGE_URL="$CLEAN_DEV_URL"
            export VITE_R2_WORKER_URL="$CLEAN_DEV_URL"
            export VITE_MAIN_REAL_CLAIM_STORAGE_URL="$CLEAN_DEV_URL"
            export VITE_MAIN_REAL_ASSETS_PUBLIC_URL="$CLEAN_DEV_URL/api/v1/assets"
          fi
          
          export VITE_LOGS_WORKER_URL="$CLEAN_LOGS_URL"
          export VITE_LOGS_API_KEY="$CLEAN_LOGS_KEY"
          
          npm run build
        env:
          # Keep existing env vars, but note that the URLs/Keys above take precedence via export
          VITE_MAIN_ASSET_TARGET_DEFAULT: "real-cloud"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Smoke Cloudflare Pages runtime locally
        shell: bash
        run: npm run validate:pages:dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ocentra-games --branch=${{ inputs.branch }}

      - name: Smoke deployed Pages HTML
        shell: bash
        run: |
          if [ "${{ inputs.branch }}" = "production" ]; then
            URL="https://ocentra-games.pages.dev/"
          else
            URL="https://${{ inputs.branch }}.ocentra-games.pages.dev/"
          fi

          for attempt in {1..12}; do
            : > /tmp/ocentra-pages.html
            HTTP_CODE=$(curl -L -sS -o /tmp/ocentra-pages.html -w "%{http_code}" "$URL" || true)
            BYTE_COUNT=$(wc -c < /tmp/ocentra-pages.html | tr -d ' ')
            echo "Pages smoke attempt ${attempt}: url=${URL} status=${HTTP_CODE} bytes=${BYTE_COUNT}"
            if [ "$HTTP_CODE" = "200" ] && [ "$BYTE_COUNT" -gt 1000 ] && grep -q '<div id="root"' /tmp/ocentra-pages.html; then
              exit 0
            fi
            sleep 10
          done

          echo "Cloudflare Pages deployment did not serve a non-empty app shell at ${URL}."
          echo "Last response:"
          cat /tmp/ocentra-pages.html || true
          exit 1
