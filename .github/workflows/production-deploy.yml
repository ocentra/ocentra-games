name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  sync-r2-prod:
    uses: ./.github/workflows/sync-r2.yml
    with:
      environment: production
    secrets: inherit

  deploy-worker-prod:
    needs: sync-r2-prod
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
    secrets: inherit

  deploy-pages-prod:
    needs: deploy-worker-prod
    uses: ./.github/workflows/deploy-pages.yml
    with:
      branch: production
    secrets: inherit
