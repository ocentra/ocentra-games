name: Pull Request Checks

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          build-domains: 'true'

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test
        env:
          SKIP_SOLANA_TESTS: 'true'

  build-rust:
    name: Build Rust Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust/ocentra-games

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "/home/runner/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install latest
          avm use latest

      - name: Build Solana contract
        working-directory: Rust/ocentra-games
        run: |
          if ! anchor build; then
            anchor keys sync
            anchor build
          fi

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: solana-idl
          path: Rust/ocentra-games/target/idl/*.json
          retention-days: 1

  test-solana:
    name: Solana Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          build-domains: 'true'

      - name: Download IDL artifact
        uses: actions/download-artifact@v4
        with:
          name: solana-idl
          path: Rust/ocentra-games/target/idl/

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          SOLANA_CLUSTER: 'devnet'
          SOLANA_RPC_URL: 'https://api.devnet.solana.com'
          SKIP_SOLANA_TESTS: 'false'

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      - name: Build project
        run: npm run build

  mobile-web-smoke:
    name: Mobile Web Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mobile viewport smoke tests
        run: npm run test:e2e -- --project=db-mobile-e2e
