name: Cloudflare Preflight

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-preflight:
    name: Cloudflare Prebuild Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci
        with:
          install-mode: ci-only

      - name: Run prebuild (same path as security tests)
        working-directory: infra/cloudflare
        run: export PATH="./node_modules/.bin:$PATH" && npm run prebuild
