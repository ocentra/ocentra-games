name: Cloudflare Preflight

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-preflight:
    name: Cloudflare Prebuild Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install all workspace dependencies (including Cloudflare)
        run: npm install --ignore-scripts

      - name: Run prebuild (same path as security tests)
        run: export PATH="./node_modules/.bin:$PATH" && npm run prebuild
