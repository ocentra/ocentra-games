# Superseded by ci-gate.yml (push to main → R2 wipe/sync → deploy:dev → Pages).
# Kept for manual-only asset/worker runs without a full CI Gate.
name: Development R2 sync and dev Worker

on:
  workflow_dispatch:

concurrency:
  group: development-r2-worker
  cancel-in-progress: false

jobs:
  sync-r2-dev:
    name: Sync assets to ocentra-assets-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.7.0

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
          npm run build --workspace=packages/game-asset-domain

      - name: Sync assets to development R2
        env:
          SYNC_ENV: development
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAIM_STORAGE_ASSETS_URL_DEV: ${{ secrets.CLAIM_STORAGE_ASSETS_URL_DEV }}
          CLAIM_STORAGE_ASSETS_TOKEN_DEV: ${{ secrets.CLAIM_STORAGE_ASSETS_TOKEN_DEV }}
          ASSETS_WORKER_URL_DEV: ${{ secrets.ASSETS_WORKER_URL_DEV }}
          ASSETS_WORKER_TOKEN_DEV: ${{ secrets.ASSETS_WORKER_TOKEN_DEV }}
        run: npm run sync:assets:dev -- --apply --prune

  deploy-worker-dev:
    name: Deploy claim-storage-dev Worker
    needs: sync-r2-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pin npm version
        run: npm install -g npm@11.7.0

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
          npm run build --workspace=packages/game-asset-domain

      - name: Deploy Worker (development)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy:dev
