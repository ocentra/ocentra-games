name: Development R2 sync and dev Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-r2-worker
  cancel-in-progress: false

jobs:
  sync-r2-dev:
    uses: ./.github/workflows/sync-r2.yml
    with:
      environment: development
    secrets: inherit

  deploy-worker-dev:
    needs: sync-r2-dev
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: development
    secrets: inherit
