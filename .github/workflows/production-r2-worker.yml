name: Production R2 sync and Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-r2-worker
  cancel-in-progress: false

jobs:
  sync-r2-prod:
    uses: ./.github/workflows/sync-r2.yml
    with:
      environment: production
    secrets: inherit

  deploy-worker-prod:
    needs: sync-r2-prod
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
    secrets: inherit
