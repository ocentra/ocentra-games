name: Production R2 sync and Worker

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-r2-worker
  cancel-in-progress: false

jobs:
  sync-r2-prod:
    name: Sync assets to ocentra-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain

      - name: Sync assets to production R2
        env:
          SYNC_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAIM_STORAGE_ASSETS_URL_PROD: ${{ secrets.CLAIM_STORAGE_ASSETS_URL_PROD }}
          CLAIM_STORAGE_ASSETS_TOKEN_PROD: ${{ secrets.CLAIM_STORAGE_ASSETS_TOKEN_PROD }}
          ASSETS_WORKER_URL_PROD: ${{ secrets.ASSETS_WORKER_URL_PROD }}
          ASSETS_WORKER_TOKEN_PROD: ${{ secrets.ASSETS_WORKER_TOKEN_PROD }}
        run: npm run sync:assets:prod -- --apply --prune

  deploy-worker-prod:
    name: Deploy claim-storage Worker
    needs: sync-r2-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain

      - name: Deploy Worker (production)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy
