name: CI Gate

on:
  pull_request:
    branches: [main, develop, production]
  push:
    branches: [main, develop, production]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: false
        type: choice
        options:
          - full
          - cloudflare-security
        default: full

permissions:
  contents: read
  security-events: write
  actions: read
  deployments: write

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
# CI Gate is a pure orchestrator. It contains ZERO inline build/deploy logic.
# Every concern lives in its own reusable workflow or composite action:
#
#   Composite Actions (functions):
#     .github/actions/setup-ci       – Machine setup (Node, Python, k6, cloudflared)
#
#   Reusable Workflows (modules):
#     secret-scan.yml              – Gitleaks + custom scanner
#     cloudflare-preflight.yml     – Prebuild validation
#     pull-request-checks.yml      – Lint, type-check, unit tests, Rust, E2E
#     cloudflare-security-tests.yml – Full security gates (static + dynamic)
#     cloudflare-security-quick.yml – Quick security gates
#     sync-r2.yml                  – R2 asset sync (dev or prod)
#     deploy-worker.yml            – Cloudflare Worker deploy (dev or prod)
#     deploy-pages.yml             – Cloudflare Pages deploy (any branch)
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Phase 0: Fail Fast ───────────────────────────────────────────────────
  # Catches ALL "stupid" failures in <5 min: broken install, missing packages,
  # broken imports, type errors, lint errors. If this passes, no downstream
  # job will ever fail for these reasons.
  fail-fast:
    name: Fail Fast (Install, Build, Lint, Types)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          install-mode: ci-only
          build-domains: 'true'
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check

  # ── Phase 1: Security Scan ──────────────────────────────────────────────
  secret-scan:
    if: github.actor != 'dependabot[bot]'
    needs: [fail-fast]
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  # ── Phase 2: Preflight ─────────────────────────────────────────────────
  cloudflare-preflight:
    if: github.actor != 'dependabot[bot]'
    needs: [secret-scan]
    uses: ./.github/workflows/cloudflare-preflight.yml
    secrets: inherit

  # ── Phase 3: Code Quality & Tests ──────────────────────────────────────
  pull-request-checks:
    if: github.actor != 'dependabot[bot]'
    needs: [cloudflare-preflight]
    uses: ./.github/workflows/pull-request-checks.yml
    secrets: inherit

  # ── Phase 4: Cloudflare Security ───────────────────────────────────────
  cloudflare-security:
    if: (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/production'))) && github.actor != 'dependabot[bot]'
    needs: [pull-request-checks]
    uses: ./.github/workflows/cloudflare-security-tests.yml
    secrets: inherit

  # ── Phase 4 (alt): Security-only mode ──────────────────────────────────
  cloudflare-security-only:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'cloudflare-security')
    uses: ./.github/workflows/cloudflare-security-quick.yml
    secrets: inherit

  # ── Dependabot shortcut ────────────────────────────────────────────────
  dependabot-cloudflare-security:
    name: Dependabot Cloudflare Security
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    uses: ./.github/workflows/cloudflare-security-quick.yml
    with:
      mode: static
    secrets: inherit

  # ── Phase 5a: Dev Deploy Pipeline (main/develop) ───────────────────────
  sync-r2-dev:
    name: R2 sync → dev
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [cloudflare-security]
    uses: ./.github/workflows/sync-r2.yml
    with:
      environment: development
    secrets: inherit

  deploy-worker-dev:
    name: Worker → dev
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [sync-r2-dev]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: development
    secrets: inherit

  deploy-pages-dev:
    name: Pages → main
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [deploy-worker-dev]
    uses: ./.github/workflows/deploy-pages.yml
    with:
      branch: main
    secrets: inherit

  # ── Phase 5b: Prod Deploy Pipeline (production) ────────────────────────
  sync-r2-prod:
    name: R2 sync → prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [cloudflare-security]
    uses: ./.github/workflows/sync-r2.yml
    with:
      environment: production
    secrets: inherit

  deploy-worker-prod:
    name: Worker → prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [sync-r2-prod]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
    secrets: inherit

  deploy-pages-prod:
    name: Pages → production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [deploy-worker-prod]
    uses: ./.github/workflows/deploy-pages.yml
    with:
      branch: production
    secrets: inherit
