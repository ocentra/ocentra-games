name: CI Gate

on:
  pull_request:
    branches: [main, develop, production]
  push:
    branches: [main, develop, production]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode
        required: false
        type: choice
        options:
          - full
          - cloudflare-security
        default: full

permissions:
  contents: read
  security-events: write
  actions: read
  deployments: write

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/secret-scan.yml
    secrets: inherit

  cloudflare-preflight:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && github.actor != 'dependabot[bot]'
    needs: [secret-scan]
    uses: ./.github/workflows/cloudflare-preflight.yml
    secrets: inherit

  pull-request-checks:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && github.actor != 'dependabot[bot]'
    needs: [cloudflare-preflight]
    uses: ./.github/workflows/pull-request-checks.yml
    secrets: inherit

  cloudflare-security:
    if: (github.event_name != 'push' || github.ref != 'refs/heads/main') && github.actor != 'dependabot[bot]'
    needs: [pull-request-checks]
    uses: ./.github/workflows/cloudflare-security-tests.yml
    secrets: inherit

  cloudflare-security-only:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'cloudflare-security') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/cloudflare-security-quick.yml
    secrets: inherit

  dependabot-cloudflare-security:
    name: Dependabot Cloudflare Security
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    uses: ./.github/workflows/cloudflare-security-quick.yml
    with:
      mode: static
    secrets: inherit

  sync-r2-main:
    name: R2 sync dev (ocentra-assets-test, incremental)
    if: ${{ false }}
    needs: [cloudflare-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore asset hash cache
        uses: actions/cache@v4
        with:
          path: infra/cloudflare/.wrangler/asset-hash-cache.json
          key: asset-sync-hash-v1-${{ runner.os }}-${{ hashFiles('packages/asset-editor/Resources/**', 'scripts/assets/**', 'scripts/sync-assets-to-prod.ts', 'scripts/assets/assetSourceRoot.ts', 'scripts/assets/buildAppAssetSlices.ts') }}
          restore-keys: |
            asset-sync-hash-v1-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
      - name: Sync assets to development R2
        env:
          SYNC_ENV: development
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAIM_STORAGE_ASSETS_URL_DEV: ${{ secrets.CLAIM_STORAGE_ASSETS_URL_DEV }}
          CLAIM_STORAGE_ASSETS_TOKEN_DEV: ${{ secrets.CLAIM_STORAGE_ASSETS_TOKEN_DEV }}
          ASSETS_WORKER_URL_DEV: ${{ secrets.ASSETS_WORKER_URL_DEV }}
          ASSETS_WORKER_TOKEN_DEV: ${{ secrets.ASSETS_WORKER_TOKEN_DEV }}
        run: npm run sync:assets:dev -- --apply --prune

  deploy-worker-dev:
    name: Deploy claim-storage-dev Worker
    if: ${{ false }}
    needs: [sync-r2-main]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
      - name: Deploy Worker (development)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy:dev

  deploy-preview-main:
    name: Deploy Pages preview (main)
    if: ${{ false }}
    needs: [deploy-worker-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Build project
        run: npm run build
        env:
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_BUCKET_NAME: ${{ secrets.VITE_R2_BUCKET_NAME }}
          VITE_LOGS_WORKER_URL: ${{ secrets.VITE_LOGS_WORKER_URL }}
          VITE_LOGS_API_KEY: ${{ secrets.LOGS_API_KEY }}
      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ocentra-games --branch=main

  sync-r2-production:
    name: R2 sync prod (ocentra-assets, incremental)
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [cloudflare-security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore asset hash cache
        uses: actions/cache@v4
        with:
          path: infra/cloudflare/.wrangler/asset-hash-cache.json
          key: asset-sync-hash-v1-${{ runner.os }}-${{ hashFiles('packages/asset-editor/Resources/**', 'scripts/assets/**', 'scripts/sync-assets-to-prod.ts', 'scripts/assets/assetSourceRoot.ts', 'scripts/assets/buildAppAssetSlices.ts') }}
          restore-keys: |
            asset-sync-hash-v1-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
      - name: Sync assets to production R2
        env:
          SYNC_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAIM_STORAGE_ASSETS_URL_PROD: ${{ secrets.CLAIM_STORAGE_ASSETS_URL_PROD }}
          CLAIM_STORAGE_ASSETS_TOKEN_PROD: ${{ secrets.CLAIM_STORAGE_ASSETS_TOKEN_PROD }}
          ASSETS_WORKER_URL_PROD: ${{ secrets.ASSETS_WORKER_URL_PROD }}
          ASSETS_WORKER_TOKEN_PROD: ${{ secrets.ASSETS_WORKER_TOKEN_PROD }}
        run: npm run sync:assets:prod -- --apply --prune

  deploy-worker-prod:
    name: Deploy claim-storage Worker (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [sync-r2-production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Build domain packages
        run: |
          npm run build --workspace=packages/boundary-domain
          npm run build --workspace=packages/logging-domain
          npm run build --workspace=packages/endpoint-domain
          npm run build --workspace=packages/network-domain
          npm run build --workspace=packages/api-domain
      - name: Deploy Worker (production)
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm ci && npm run deploy

  deploy-production-pages:
    name: Deploy Pages production
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [deploy-worker-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - name: Build project
        run: npm run build
        env:
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_R2_BUCKET_NAME: ${{ secrets.VITE_R2_BUCKET_NAME }}
          VITE_LOGS_WORKER_URL: ${{ secrets.VITE_LOGS_WORKER_URL }}
          VITE_LOGS_API_KEY: ${{ secrets.LOGS_API_KEY }}
      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ocentra-games --branch=production
