name: Mobile Smoke Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  mobile-web-smoke:
    name: Mobile Web Smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
        with:
          build-domains: 'true'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run mobile viewport smoke tests
        run: npm run test:e2e -- --project=db-mobile-e2e
