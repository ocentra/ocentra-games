name: Secret Scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secrets and Sensitive Files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci
        with:
          install-mode: skip

      - name: Run repository secret scanner
        run: node scripts/security/scan-staged-secrets.mjs --repo

      - name: Install gitleaks CLI (OSS)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks scan
        run: gitleaks detect --source . --redact --verbose --log-opts="HEAD"
