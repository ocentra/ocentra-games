name: Jscrambler Code Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check Jscrambler inputs
        id: jscrambler-preflight
        shell: bash
        run: |
          if [ -f jscrambler.json ] && [ -n "${{ secrets.JSCRAMBLER_APPLICATION_ID }}" ] && [ -n "${{ secrets.JSCRAMBLER_SECRET_KEY }}" ] && [ -n "${{ secrets.JSCRAMBLER_ACCESS_KEY }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Jscrambler because jscrambler.json or required secrets are missing."
          fi

      - if: steps.jscrambler-preflight.outputs.run == 'true'
        uses: ./.github/actions/setup-ci

      - if: steps.jscrambler-preflight.outputs.run == 'true'
        run: npm run build

      - name: Jscrambler Code Integrity
        id: jscrambler
        if: steps.jscrambler-preflight.outputs.run == 'true'
        uses: jscrambler/code-integrity-actions/protect@ab65962a2ecffcc362b75a997e24a181d0bde5fb
        with:
          application-id: ${{ secrets.JSCRAMBLER_APPLICATION_ID }}
          secret-key: ${{ secrets.JSCRAMBLER_SECRET_KEY }}
          access-key: ${{ secrets.JSCRAMBLER_ACCESS_KEY }}
          jscrambler-config-path: jscrambler.json
          files-src: |
            dist/**/*
          files-dest: .
