name: Cloudflare Security Quick Gates

on:
  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: both
  workflow_dispatch:
    inputs:
      mode:
        description: Run dynamic, static, or both gates
        required: false
        type: choice
        options:
          - both
          - dynamic
          - static
        default: both

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-dynamic-security:
    name: Cloudflare Dynamic Security Gates (Quick)
    if: ${{ inputs.mode == 'both' || inputs.mode == 'dynamic' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOG_BRIDGE_URL: https://ocentra-log-bridge-ci.ocentra.ca
      CF_TESTS_STRIPE_SECRET_KEY: ${{ secrets.CF_TESTS_STRIPE_SECRET_KEY }}
      CF_TESTS_FIREBASE_PRIVATE_KEY_PEM: ${{ secrets.CF_TESTS_FIREBASE_PRIVATE_KEY_PEM }}
      CF_TESTS_AI_SUBSTITUTE_DEFAULT_KEY: ${{ secrets.CF_TESTS_AI_SUBSTITUTE_DEFAULT_KEY }}
      CF_TESTS_AI_LEAKAGE_FAKE_KEY: ${{ secrets.CF_TESTS_AI_LEAKAGE_FAKE_KEY }}
      CF_TESTS_AI_API_KEY: ${{ secrets.CF_TESTS_AI_API_KEY }}
    defaults:
      run:
        working-directory: infra/cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci
        with:
          install-mode: ci-only
          install-python: 'true'
          install-k6: 'true'
          install-cloudflared: 'true'

      - name: Build domain packages and generate log modules
        run: npm run prebuild

      - name: Start log bridge
        working-directory: .
        run: |
          cd packages/logging-domain && npm run bridge &
          sleep 3
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/__health__ > /dev/null 2>&1; then
              echo "Log bridge ready"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Log bridge did not become ready"
              exit 1
            fi
            sleep 1
          done

      - name: Start CI tunnel
        env:
          CLOUDFLARE_TUNNEL_CI_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_CI_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_CI_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_CI_TOKEN secret is not set. See infra/cloudflare/docs/TUNNEL-CI.md"
            exit 1
          fi
          cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_CI_TOKEN" &
          sleep 5
          for i in $(seq 1 30); do
            if curl -fsS "${LOG_BRIDGE_URL}/__health__" > /dev/null 2>&1; then
              echo "CI tunnel ready at ${LOG_BRIDGE_URL}"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "CI tunnel did not become reachable at ${LOG_BRIDGE_URL}"
              exit 1
            fi
            sleep 1
          done

      - name: Install Schemathesis
        run: pip install schemathesis==4.9.0

      - name: Enable auth for dynamic security tests
        run: |
          if grep -q '^DISABLE_AUTH=' .dev.vars; then
            sed -i 's/^DISABLE_AUTH=.*/DISABLE_AUTH=false/' .dev.vars
          else
            printf '\nDISABLE_AUTH=false\n' >> .dev.vars
          fi

      - name: Start Worker for dynamic tests
        run: |
          mkdir -p infra/cloudflare/test-runner/logs
          env -u RUNNER_TRACKING_ID nohup npx wrangler dev --env development --port 8787 --local > infra/cloudflare/test-runner/logs/wrangler-dynamic-security.log 2>&1 < /dev/null &
          WRANGLER_PID=$!
          echo "WRANGLER_PID=$WRANGLER_PID" >> "$GITHUB_ENV"
          disown || true
          sleep 10
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then
              echo "Worker ready"
              exit 0
            fi
            sleep 1
          done
          echo "Worker did not become ready"
          cat infra/cloudflare/test-runner/logs/wrangler-dynamic-security.log || true
          exit 1

      - name: Generate k6 constants
        run: npm run generate:k6-constants

      - name: Schemathesis API fuzzing
        run: npm run test:schemathesis
        env:
          WORKER_URL: http://127.0.0.1:8787

      - name: k6 load/concurrency
        run: npm run test:k6
        env:
          WORKER_URL: http://127.0.0.1:8787

      - name: k6 soak (smoke profile)
        run: npm run test:k6:soak
        env:
          WORKER_URL: http://127.0.0.1:8787
          SOAK_WARMUP: 5s
          SOAK_DURATION: 20s
          SOAK_COOLDOWN: 5s
          SOAK_TARGET_VUS: 10

      - name: k6 memory pressure (smoke profile)
        run: npm run test:k6:memory
        env:
          WORKER_URL: http://127.0.0.1:8787
          MEMORY_STAGE_DURATION: 20s
          MEMORY_TARGET_VUS: 10
          MEMORY_PAYLOAD_KB: 64

      - name: k6 FD/socket pressure (smoke profile)
        run: npm run test:k6:fd
        env:
          WORKER_URL: http://127.0.0.1:8787
          FD_STAGE_DURATION: 20s
          FD_TARGET_VUS: 25
          WS_HOLD_MS: 1000

      - name: Stop Worker
        if: always()
        run: |
          if [ -n "$WRANGLER_PID" ]; then
            kill "$WRANGLER_PID" 2>/dev/null || true
          fi
          pkill -f "wrangler dev" || true

      - name: Upload dynamic security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dynamic-security-artifacts
          path: |
            infra/cloudflare/test-runner/logs/**
            infra/cloudflare/test-runner/ReportJson/**
          retention-days: 7
          if-no-files-found: ignore

  cloudflare-static-security:
    name: Cloudflare Static Security Gates (Quick)
    if: ${{ inputs.mode == 'both' || inputs.mode == 'static' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: python3 -m pip install semgrep==1.147.0

      - name: Semgrep scan
        working-directory: infra/cloudflare
        run: semgrep scan --config p/security-audit --config p/owasp-top-ten --config p/typescript src

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Prepare prod-only Trivy scan tree
        run: |
          TRIVY_SCAN_DIR="${RUNNER_TEMP}/cloudflare-trivy-scan"
          rm -rf "$TRIVY_SCAN_DIR"
          mkdir -p "$TRIVY_SCAN_DIR/infra/cloudflare"
          cp infra/cloudflare/package.json infra/cloudflare/package-lock.json "$TRIVY_SCAN_DIR/infra/cloudflare/"
          ln -s "$GITHUB_WORKSPACE/packages" "$TRIVY_SCAN_DIR/packages"
          cd "$TRIVY_SCAN_DIR/infra/cloudflare"
          npm ci --ignore-scripts --omit=dev --omit=optional --no-audit
          rm package-lock.json
          rm -f "$TRIVY_SCAN_DIR/packages"
          rm -rf node_modules/@ocentra
          echo "TRIVY_SCAN_DIR=$TRIVY_SCAN_DIR" >> "$GITHUB_ENV"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.69.3
          trivy --version

      - name: Run Trivy vulnerability scanner
        run: trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH --exit-code 1 --skip-dirs node_modules/@ocentra "${TRIVY_SCAN_DIR}/infra/cloudflare"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
