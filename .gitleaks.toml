title = "ocentra-games"

[extend]
useDefault = true

[allowlist]
description = "Gitignored paths; SourceHtml is committed wiki scrape; empty CF_TESTS= lines are placeholders (not secrets)."
paths = [
  '''^\.cursor/debug\.log$''',
  '''^\.env$''',
  '''^gitleaks-report\.json$''',
  '''^gitleaks-local-report\.json$''',
  '''^infra/cloudflare/combined_output\.txt$''',
  '''^infra/cloudflare/reports/''',
  '''^infra/firebase/google-services\.json$''',
  '''^packages/card-games/src/SourceHtml/''',
  '''^platforms/mobile/android/app/google-services\.json$''',
]
regexes = [
  '''CF_TESTS_[A-Z0-9_]+=\s*$''',
]
