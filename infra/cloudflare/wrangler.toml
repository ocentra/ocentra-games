FIREBASE_PROJECT_ID = "claim-b020c"
# Per critique Issue #12: Reject * in production for security
# Production domain: https://game.ocentra.ca
CORS_ORIGIN = "https://game.ocentra.ca"
# Allow Pages deployments for preview environments and main app
CORS_ALLOWED_ORIGINS = ".ocentra-games.pages.dev"
# Rate limiting: 100 requests per minute for logs API
RATE_LIMIT_MATCHES_PER_HOUR = "100"
# Logging: Production = errors/warnings only (safe by default)
# Production debugging: Use X-Debug-Modules header per-request
LOG_LEVEL = "warn"
# Analytics error/warn gates (free plan: 100K data points/day)
ERROR_LOG_SAMPLE_RATE = "0.1"
WARN_LOG_SAMPLE_RATE = "0.1"
# Set to "true" to disable error/warn Analytics logging
# ERROR_LOGGING_DISABLED = "false"
# Public R2 base URL for assets (e.g. https://assets.ocentra.ca); set via wrangler secret or dashboard
ASSETS_PUBLIC_URL = ""

[env.production.alias]
"@/logging/domain-logger-init" = "./src/logging/domain-logger-stub.ts"


