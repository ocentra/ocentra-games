[env.development.vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "claim-b020c"
BUCKET_NAME = "claim-matches-test"  # Test bucket name for safety checks
# Development: Allow all origins (*) for local testing (localhost, etc.)
# Production: Must use specific origin (https://game.ocentra.ca)
CORS_ORIGIN = "*"  # Allows localhost:5173, localhost:3000, etc. for local dev
# Rate limiting: Higher limit for testing (1000/hour to avoid test failures)
RATE_LIMIT_MATCHES_PER_HOUR = "1000"
# Signed URL secret for testing (required for signed URL tests)
SIGNED_URL_SECRET = "test-secret-key-for-development-only-change-in-production"
# Authentication: TEST_MODE enables test-token:userId format for local dev/testing
# In production, TEST_MODE is not set - requires real Firebase JWT authentication
TEST_MODE = "true"  # Enables test-token:userId format (extracts userId from token)
# DISABLE_AUTH: allows manifest/rebuild without token (dev only - npm run dev uses this)
DISABLE_AUTH = "true"
# Logging: Dev/Test = all modules enabled, Production = errors/warnings only
# Production debugging: Use X-Debug-Modules header per-request
LOG_LEVEL = "info"
# Test/dev only - use wrangler secret for real key in prod
AI_MASTER_KEY = "YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
# Plan F: Turnstile client key (use wrangler secret in prod)
TURNSTILE_SITE_KEY = ""
# Public R2 base URL for assets (manifest/current.asset); set in prod to e.g. https://assets.ocentra.ca
ASSETS_PUBLIC_URL = ""
R2_ASSETS_BUCKET_NAME = "ocentra-assets-test"
CLOUDFLARE_ACCOUNT_ID = "d01281f9b13a2a8c46dfa2c516094de6"

[env.development.triggers]
crons = ["0 3 * * *", "*/5 * * * *", "*/1 * * * *"]

