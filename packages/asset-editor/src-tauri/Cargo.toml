[package]
name = "ocentraeditor"
version = "0.1.0"
description = "Ocentra Asset Editor — desktop app for creating and editing game assets"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ocentraeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
json5 = "0.4"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
sha2 = "0.10"
image = "0.25"
webp = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
tauri-plugin-dialog = "2"
rayon = "1.10"

[profile.dev]
incremental = true
codegen-units = 256
debug = 1
