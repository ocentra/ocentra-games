<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="150 90 700 220"
     width="100%"
     height="100%"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <filter id="glowPurpleStrong" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurpleMid" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bodyFill" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b064a"/>
      <stop offset="65%" stop-color="#17002a"/>
      <stop offset="100%" stop-color="#0a0013"/>
    </radialGradient>

    <linearGradient id="sideFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0f69"/>
      <stop offset="50%" stop-color="#21043c"/>
      <stop offset="100%" stop-color="#10011f"/>
    </linearGradient>

    <!-- side back -->
    <g id="sideBack">
      <path d="M 60 -68
               L 15 -68
               L -25 -45
               L -25 -12
               L 15 -12
               Q 40 -40 60 -68 Z"/>
      <path d="M 15 12
               L -25 12
               L -25 45
               L 15 68
               L 60 68
               Q 40 40 15 12 Z"/>
    </g>

    <!-- side front -->
    <g id="sideFront">
      <path d="M -25 -22
               L 4 -12
               Q 10 0 4 12
               L -25 22
               Q -42 0 -25 -22 Z"/>
    </g>
  </defs>

  <!-- floor glow -->
  <ellipse cx="500" cy="263" rx="190" ry="18"
           fill="#9d00ff" opacity="0.30" filter="url(#glowPurpleStrong)"/>
  <ellipse cx="500" cy="266" rx="110" ry="5"
           fill="#e25eff" opacity="0.55" filter="url(#glowPurpleStrong)"/>

  <!-- body outer glow -->
  <rect x="250" y="130" width="500" height="140" rx="58"
        fill="none" stroke="#9d00ff" stroke-width="16" opacity="0.28"
        filter="url(#glowPurpleStrong)"/>
  <rect x="250" y="130" width="500" height="140" rx="58"
        fill="none" stroke="#e25eff" stroke-width="8" opacity="0.45"
        filter="url(#glowPurpleMid)"/>

  <!-- left back -->
  <g transform="translate(250 200)">
    <use href="#sideBack"
         fill="none" stroke="#b020ff" stroke-width="7"
         stroke-linejoin="round" opacity="0.7"
         filter="url(#glowPurpleMid)"/>
    <use href="#sideBack"
         fill="url(#sideFill)" stroke="#eb7aff" stroke-width="2"
         stroke-linejoin="round"/>
    <use href="#sideBack"
         fill="none" stroke="#ffffff" stroke-width="0.5"
         opacity="0.28" transform="translate(1 1)"/>
  </g>

  <!-- right back -->
  <g transform="translate(750 200) scale(-1 1)">
    <use href="#sideBack"
         fill="none" stroke="#b020ff" stroke-width="7"
         stroke-linejoin="round" opacity="0.7"
         filter="url(#glowPurpleMid)"/>
    <use href="#sideBack"
         fill="url(#sideFill)" stroke="#eb7aff" stroke-width="2"
         stroke-linejoin="round"/>
    <use href="#sideBack"
         fill="none" stroke="#ffffff" stroke-width="0.5"
         opacity="0.28" transform="translate(1 1)"/>
  </g>

  <!-- main body -->
  <rect x="250" y="130" width="500" height="140" rx="58" fill="url(#bodyFill)"/>

  <!-- dark inner rim -->
  <rect x="250" y="130" width="500" height="140" rx="58"
        fill="none" stroke="#000000" stroke-width="8" opacity="0.45"
        filter="url(#softShadow)"/>

  <!-- main edge -->
  <rect x="250" y="130" width="500" height="140" rx="58"
        fill="none" stroke="#ea6bff" stroke-width="3"/>

  <!-- dotted inner line, pulled inward -->
  <rect x="270" y="150" width="460" height="100" rx="38"
        fill="none"
        stroke="#ffca28"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-dasharray="0.1 15"
        opacity="0.95"
        filter="url(#glowYellow)"/>

  <rect x="270" y="150" width="460" height="100" rx="38"
        fill="none"
        stroke="#fff59d"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-dasharray="0.1 15"/>

  <!-- left front -->
  <g transform="translate(250 200)">
    <use href="#sideFront"
         fill="none" stroke="#b020ff" stroke-width="7"
         stroke-linejoin="round" opacity="0.7"
         filter="url(#glowPurpleMid)"/>
    <use href="#sideFront"
         fill="url(#sideFill)" stroke="#eb7aff" stroke-width="2"
         stroke-linejoin="round"/>
    <use href="#sideFront"
         fill="none" stroke="#ffffff" stroke-width="0.5"
         opacity="0.28" transform="translate(1 1)"/>
  </g>

  <!-- right front -->
  <g transform="translate(750 200) scale(-1 1)">
    <use href="#sideFront"
         fill="none" stroke="#b020ff" stroke-width="7"
         stroke-linejoin="round" opacity="0.7"
         filter="url(#glowPurpleMid)"/>
    <use href="#sideFront"
         fill="url(#sideFill)" stroke="#eb7aff" stroke-width="2"
         stroke-linejoin="round"/>
    <use href="#sideFront"
         fill="none" stroke="#ffffff" stroke-width="0.5"
         opacity="0.28" transform="translate(1 1)"/>
  </g>
</svg>